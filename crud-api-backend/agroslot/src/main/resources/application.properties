spring.application.name=agroslot

spring.datasource.url=jdbc:postgresql://localhost:5433/agroslot_db
spring.datasource.username=agroslot_user
spring.datasource.password=agroslot_pass_dev

# O banco já foi criado pelo schema.sql, então o Hibernate só CONFERE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket-name=agroslot.images

# Configurações JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Configurações de recuperação de senha
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail-from=${SMTP_FROM:no-reply@agroslot.local}
app.password-reset-token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}

# Configuração SMTP para desenvolvimento local
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000